plugins {
    id 'com.android.application'
    id 'io.sentry.android.gradle'
}

def gitSha = 'unknown'
try {
    def proc = 'git rev-parse --short HEAD'.execute([], projectDir)
    proc.waitForOrKill(1000)
    gitSha = proc.text.trim()
} catch (Exception ignored) {}

def hasEnvSigning =
        System.getenv("KEYSTORE_FILE") &&
        System.getenv("KEYSTORE_PASSWORD") &&
        System.getenv("KEY_ALIAS") &&
        System.getenv("KEY_PASSWORD")

// CI injects signing credentials via Gradle -P properties
def hasInjectedSigning =
        project.hasProperty("android.injected.signing.store.file") &&
        project.hasProperty("android.injected.signing.store.password") &&
        project.hasProperty("android.injected.signing.key.alias") &&
        project.hasProperty("android.injected.signing.key.password")

def hasReleaseSigning = hasEnvSigning || hasInjectedSigning

android {
    namespace 'com.digipal.signage'
    compileSdk 35

    signingConfigs {
        release {
            if (hasEnvSigning) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.digipal.signage"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "SERVER_URL", "\"https://www.digipalsignage.com\""
        buildConfigField "String", "SENTRY_DSN", "\"${System.getenv('SENTRY_DSN') ?: ''}\""
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""
        buildConfigField "String", "BUILD_FLAVOR", "\"amazon-fire-tv\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def buildingUnguardedRelease =
            (graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease')) &&
            !hasReleaseSigning
    if (buildingUnguardedRelease) {
        throw new GradleException("Release signing env vars are required: KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (or the equivalent android.injected.signing.* -P properties)")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-datasource:1.3.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.sentry:sentry-android:7.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}

sentry {
    def sentryToken = System.getenv("SENTRY_AUTH_TOKEN") ?: ""
    def isCi = System.getenv("CI") == "true" || System.getenv("GITHUB_ACTIONS") == "true"
    autoUploadProguardMapping = isCi && !sentryToken.isEmpty()
    includeNativeSources = false
    org = "digipal-signage"
    projectName = "android"
    authToken = sentryToken
    telemetry = false
    tracingInstrumentation {
        enabled = false
    }
}
