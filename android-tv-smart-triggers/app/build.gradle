plugins {
    id 'com.android.application'
    id 'io.sentry.android.gradle'
}

def gitSha = 'unknown'
try {
    def proc = 'git rev-parse --short HEAD'.execute([], projectDir)
    proc.waitForOrKill(1000)
    gitSha = proc.text.trim()
} catch (Exception ignored) {}

def hasEnvSigning =
        System.getenv("KEYSTORE_FILE") &&
        System.getenv("KEYSTORE_PASSWORD") &&
        System.getenv("KEY_ALIAS") &&
        System.getenv("KEY_PASSWORD")

// CI (build-android-tv.yml) injects signing credentials via Gradle -P properties
// (android.injected.signing.*) rather than env vars — recognize that path too so
// release builds in CI are not incorrectly blocked.
def hasInjectedSigning =
        project.hasProperty("android.injected.signing.store.file") &&
        project.hasProperty("android.injected.signing.store.password") &&
        project.hasProperty("android.injected.signing.key.alias") &&
        project.hasProperty("android.injected.signing.key.password")

def hasReleaseSigning = hasEnvSigning || hasInjectedSigning

// Branch-local, opt-in installer for physical startup validation. Release URL,
// package, signing and auto-start behavior remain unchanged.
def startupConfigFile = rootProject.file('startup-test.properties')
def startupTestUrl = null
if (startupConfigFile.exists()) {
    def startupConfig = new Properties()
    startupConfigFile.withInputStream { startupConfig.load(it) }
    startupTestUrl = startupConfig.getProperty('serverUrl')
    def uri = new URI(startupTestUrl ?: '')
    if (uri.scheme != 'https' || !uri.host || uri.rawUserInfo ||
        uri.rawQuery || uri.rawFragment || (uri.path && uri.path != '/')) {
        throw new GradleException('Startup test requires a root HTTPS URL without credentials, query or fragment')
    }
}

android {
    namespace 'com.nexuscast.player'
    compileSdk 36

    signingConfigs {
        release {
            if (hasEnvSigning) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
            // When only hasInjectedSigning is true, leave fields unset here — the
            // Android Gradle Plugin auto-populates them from the injected
            // android.injected.signing.* properties passed via -P on the CLI.
        }
    }

    defaultConfig {
        applicationId "com.nexuscast.player"
        minSdk 21
        targetSdk 36
        versionCode 47
        versionName "4.0.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SERVER_URL", "\"https://www.digipalsignage.com\""
        buildConfigField "String", "SENTRY_DSN", "\"${System.getenv('SENTRY_DSN') ?: ''}\""
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""
        buildConfigField "String", "BUILD_FLAVOR", "\"android-tv\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "Digipal Smart Triggers (Debug)"
            debuggable true
            minifyEnabled false
        }
        if (startupTestUrl) {
            startupTest {
                initWith release
                applicationIdSuffix ".startuptest"
                versionNameSuffix "-startup-test"
                resValue "string", "app_name", "Digipal ST Startup Test"
                buildConfigField "String", "SERVER_URL", "\"${startupTestUrl}\""
                matchingFallbacks = ['release']
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

if (startupTestUrl) {
    // Existing ST CI uploads release/*; no workflow or other variant edits.
    tasks.register('stageStartupTestApk', Copy) {
        dependsOn 'assembleStartupTest'
        from layout.buildDirectory.file('outputs/apk/startupTest/app-startupTest.apk')
        into rootProject.file('release')
        rename { 'Digipal-ST-Startup-Test-v4.0.7.apk' }
        doLast {
            exec {
                workingDir rootProject.projectDir
                commandLine 'python3', 'scripts/verify-artifact.py',
                    'release/Digipal-ST-Startup-Test-v4.0.7.apk',
                    '--tools', "${android.sdkDirectory}/build-tools/36.0.0",
                    '--version', '4.0.7-startup-test', '--startup-test'
            }
        }
    }
    tasks.matching { it.name == 'assembleRelease' }.configureEach {
        finalizedBy 'stageStartupTestApk'
    }
}

gradle.taskGraph.whenReady { graph ->
    // Guard BOTH release output tasks (APK and AAB) — previously only
    // assembleRelease was checked, so `./gradlew bundleRelease` could silently
    // produce an unsigned release AAB when no signing config was supplied.
    def buildingUnguardedRelease =
            (graph.hasTask(':app:assembleRelease') || graph.hasTask(':app:bundleRelease') ||
             graph.hasTask(':app:assembleStartupTest') || graph.hasTask(':app:bundleStartupTest')) &&
            !hasReleaseSigning
    if (buildingUnguardedRelease) {
        throw new GradleException("Release signing env vars are required: KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (or the equivalent android.injected.signing.* -P properties)")
    }
}

// Run for debug, production and instrumented builds without changing release workflows.
tasks.register("verifyGestureRuntimeAssets", Exec) {
    workingDir projectDir.parentFile
    commandLine "python3", "scripts/check-gesture-runtime.py"
}
tasks.named("preBuild").configure { dependsOn("verifyGestureRuntimeAssets") }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    // ExoPlayer (Media3) — native video overlay via PlayerView
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    // ExoPlayer on-disk video cache
    implementation 'androidx.media3:media3-datasource:1.4.1'
    // Glide — native image overlay
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    // Room — offline playlist cache + native playlist DB
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    // WorkManager — crash recovery with back-off
    implementation 'androidx.work:work-runtime:2.9.0'
    // OkHttp — asset downloader with SHA256 + ETag + Range resume
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Sentry — crash & ANR reporting
    implementation 'io.sentry:sentry-android:8.16.0'
    // Debug-only: memory leak detection + OkHttp request logging
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}

sentry {
    // Only upload ProGuard mapping when SENTRY_AUTH_TOKEN is available AND we're
    // running in CI — a local dev machine that happens to have the token exported
    // should not also attempt this upload (its paths/sourcemaps aren't CI-shaped, so
    // it can fail spuriously outside a real CI run).
    def sentryToken = System.getenv("SENTRY_AUTH_TOKEN") ?: ""
    def isCi = System.getenv("CI") == "true" || System.getenv("GITHUB_ACTIONS") == "true"
    autoUploadProguardMapping = isCi && !sentryToken.isEmpty()
    includeNativeSources = false
    org = "digipal-signage"
    projectName = "android"
    authToken = sentryToken
    telemetry = false
    // We only use manual Sentry.captureException()/breadcrumbs — disable ASM bytecode
    // auto-instrumentation (OkHttp/Compose/FileIO tracing) to avoid corrupting unrelated
    // classes it can't fully resolve (seen as "ASM Instrumentation... wasn't able to
    // resolve some classes" in build output).
    tracingInstrumentation {
        enabled = false
    }
}
