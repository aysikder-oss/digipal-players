plugins {
      id 'com.android.application'
  }

  def gitSha = 'unknown'
  try {
      def proc = 'git rev-parse --short HEAD'.execute([], projectDir)
      proc.waitForOrKill(1000)
      gitSha = proc.text.trim()
  } catch (Exception ignored) {}
  

  android {
      namespace 'com.nexuscast.player'
      compileSdk 35

      signingConfigs {
          release {
              storeFile file(System.getenv("KEYSTORE_FILE") ?: "keystore.jks")
              storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
              keyAlias System.getenv("KEY_ALIAS") ?: ""
              keyPassword System.getenv("KEY_PASSWORD") ?: ""
          }
      }

      defaultConfig {
          applicationId "com.nexuscast.player"
          minSdk 21
          targetSdk 35
          versionCode 30
          versionName "3.12.8"

          buildConfigField "String", "SERVER_URL", "\"https://www.digipalsignage.com\""
          buildConfigField "String", "SENTRY_DSN", "\"${System.getenv('SENTRY_DSN') ?: ''}\""
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""
        buildConfigField "String", "BUILD_FLAVOR", "\"android-tv-st\""

          javaCompileOptions {
              annotationProcessorOptions {
                  arguments += ["room.schemaLocation": "$projectDir/schemas"]
              }
          }
      }

      buildTypes {
          release {
              signingConfig signingConfigs.release
              minifyEnabled true
              proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
          }
          debug {
              minifyEnabled false
          }
      }

      compileOptions {
          sourceCompatibility JavaVersion.VERSION_1_8
          targetCompatibility JavaVersion.VERSION_1_8
      }

      buildFeatures {
          buildConfig true
      }

      lintOptions {
          abortOnError false
      }

      packagingOptions {
          resources {
              excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
          }
      }
  }

  dependencies {
      implementation 'androidx.appcompat:appcompat:1.6.1'
      implementation 'androidx.webkit:webkit:1.9.0'
      implementation 'com.google.android.material:material:1.11.0'
      implementation 'androidx.media3:media3-exoplayer:1.3.1'
      implementation 'androidx.media3:media3-ui:1.3.1'
      implementation 'androidx.media3:media3-common:1.3.1'
      // ExoPlayer on-disk video cache
      implementation 'androidx.media3:media3-datasource:1.3.1'
      implementation 'com.github.bumptech.glide:glide:4.16.0'
      annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
      // Room — offline playlist cache + native playlist DB
      implementation 'androidx.room:room-runtime:2.6.1'
      annotationProcessor 'androidx.room:room-compiler:2.6.1'
      // WorkManager — crash recovery with back-off
      implementation 'androidx.work:work-runtime:2.9.0'
      // OkHttp — asset downloader with SHA256 + ETag + Range resume
      implementation 'com.squareup.okhttp3:okhttp:4.12.0'
      // Sentry — crash & ANR reporting
      implementation 'io.sentry:sentry-android:7.14.0'
  }
