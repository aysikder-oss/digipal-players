name: Build NexusCast (Amazon Fire TV)

on:
  workflow_dispatch:
  push:
    tags:
      - 'amazon-fire-tv-v*'
    paths:
      - 'amazon fire tv (android)/**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x "amazon fire tv (android)/gradlew"

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "amazon fire tv (android)/app/release.keystore"

      - name: Build Release APK (signed)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: "amazon fire tv (android)"
        run: |
          ./gradlew assembleRelease \
            "-Pandroid.injected.signing.store.file=$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Build Release AAB (signed)
        if: env.KEYSTORE_BASE64 != ''
        working-directory: "amazon fire tv (android)"
        run: |
          ./gradlew bundleRelease \
            "-Pandroid.injected.signing.store.file=$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Build Debug APK (unsigned, no keystore)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: "amazon fire tv (android)"
        run: ./gradlew assembleDebug

      - name: Build Debug AAB (unsigned, no keystore)
        if: env.KEYSTORE_BASE64 == ''
        working-directory: "amazon fire tv (android)"
        run: ./gradlew bundleDebug

      - name: Rename artifacts
        run: |
          for f in "amazon fire tv (android)/app/build/outputs/apk/debug/"*.apk; do
            [ -f "$f" ] && mv "$f" "amazon fire tv (android)/app/build/outputs/apk/debug/NexusCast-v1.0.0.apk"
          done
          for f in "amazon fire tv (android)/app/build/outputs/bundle/debug/"*.aab; do
            [ -f "$f" ] && mv "$f" "amazon fire tv (android)/app/build/outputs/bundle/debug/NexusCast-v1.0.0.aab"
          done
          for f in "amazon fire tv (android)/app/build/outputs/apk/release/"*.apk; do
            [ -f "$f" ] && mv "$f" "amazon fire tv (android)/app/build/outputs/apk/release/NexusCast-v1.0.0.apk"
          done
          for f in "amazon fire tv (android)/app/build/outputs/bundle/release/"*.aab; do
            [ -f "$f" ] && mv "$f" "amazon fire tv (android)/app/build/outputs/bundle/release/NexusCast-v1.0.0.aab"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexuscast-amazon-fire-tv-apk
          path: |
            amazon fire tv (android)/app/build/outputs/apk/release/*.apk
            amazon fire tv (android)/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexuscast-amazon-fire-tv-aab
          path: |
            amazon fire tv (android)/app/build/outputs/bundle/release/*.aab
            amazon fire tv (android)/app/build/outputs/bundle/debug/*.aab
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/amazon-fire-tv-v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.apk
            artifacts/**/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
