name: Build NexusCast (Amazon Fire TV)

on:
  workflow_dispatch:
  push:
    tags:
      - 'amazon-fire-tv-v*'
    paths:
      - 'amazon fire tv (android)/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Prepare existing NexusCast signer
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexuscast-release.jks"
          printf 'KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/nexuscast-release.jks" >> "$GITHUB_ENV"
      - name: Test, lint and build production artifacts
        working-directory: "amazon fire tv (android)"
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleDebugAndroidTest assembleRelease bundleRelease --stacktrace
      - name: Verify production identity and name artifacts
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="amazon fire tv (android)"
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' "$PROJECT/app/build.gradle" | head -1)
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' "$PROJECT/app/build.gradle" | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "amazon-fire-tv-v$VERSION"
          fi
          python3 android-offline-core/scripts/verify-release.py \
            --project "$PROJECT" --package com.nexuscast.player \
            --version "$VERSION" --code "$CODE" \
            --certificate 2055618e3581a00144510e3a94b2a8e9265b66213f22a9e6c7e43ef75516c87f
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            "$PROJECT/app/build/outputs/apk/release/app-release.apk" > "$RUNNER_TEMP/nexuscast-badging.txt"
          grep -F "application-label:'NexusCast TV'" "$RUNNER_TEMP/nexuscast-badging.txt"
          if grep -E 'android.permission.(CAMERA|RECORD_AUDIO)' "$RUNNER_TEMP/nexuscast-badging.txt"; then
            echo "Unexpected Smart Triggers permissions in standard Fire TV app"; exit 1
          fi
          cp "$PROJECT/app/build/outputs/apk/release/app-release.apk" "$PROJECT/release/NexusCast-TV-v$VERSION-build$CODE.apk"
          cp "$PROJECT/app/build/outputs/bundle/release/app-release.aab" "$PROJECT/release/NexusCast-TV-v$VERSION-build$CODE.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: nexuscast-amazon-production
          path: "amazon fire tv (android)/release/*"
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nexuscast-amazon-test-reports
          path: "amazon fire tv (android)/app/build/reports/"
      - name: Delete transient signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/nexuscast-release.jks"

  release:
    if: startsWith(github.ref, 'refs/tags/amazon-fire-tv-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nexuscast-amazon-production
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/*.aab
          generate_release_notes: true
