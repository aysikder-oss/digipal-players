name: Windows Player Release

on:
  push:
    tags:
      - 'windows-v*'
      - 'windows-st-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. windows-v2.5.3 or windows-st-v2.2.2)'
        required: true

jobs:
  build-standard:
    name: Build Windows Player
    if: startsWith(github.ref, 'refs/tags/windows-v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'windows-v') && !startsWith(github.event.inputs.tag, 'windows-st-v'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: windows
        run: npm install

      - name: Build NSIS installer
        working-directory: windows
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/release/*.exe
          if-no-files-found: error

  build-smart-triggers:
    name: Build Windows Smart Triggers Player
    if: startsWith(github.ref, 'refs/tags/windows-st-v') || (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'windows-st-v'))
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (skip native build scripts)
        working-directory: windows-smart-triggers
        run: npm install --ignore-scripts

      - name: Rebuild native modules for Electron
        working-directory: windows-smart-triggers
        run: npx electron-rebuild --force

      - name: Build NSIS installer
        working-directory: windows-smart-triggers
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-st-installer
          path: windows-smart-triggers/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-standard, build-smart-triggers]
    if: always() && (needs.build-standard.result == 'success' || needs.build-smart-triggers.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: ${{ github.ref_name || github.event.inputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*.exe
