name: Build isolated Smartboard DEV test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Build, lint and unit-test the DEV app only
        working-directory: android-tv
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify the isolated installer
        run: |
          set -euo pipefail
          mkdir -p smartboard-dev-output
          APK=android-tv/app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > smartboard-dev-output/verification.txt
          "$TOOLS/aapt" dump badging "$APK" >> smartboard-dev-output/verification.txt
          grep -q "package: name='com.digipal.signage.smartboarddev'" smartboard-dev-output/verification.txt
          grep -q "versionCode='149'" smartboard-dev-output/verification.txt
          grep -q "application-debuggable" smartboard-dev-output/verification.txt
          CONFIG=android-tv/app/build/generated/source/buildConfig/debug/com/digipal/signage/BuildConfig.java
          grep -F 'https://3922e89f-d02d-4a8b-add9-9f42fce9e5ea-00-sisthqoc0pvv.worf.replit.dev:5000' "$CONFIG" >> smartboard-dev-output/verification.txt
          grep -F 'BUILD_FLAVOR' "$CONFIG" >> smartboard-dev-output/verification.txt
          cp "$APK" smartboard-dev-output/Digipal-Smartboard-DEV-build149.apk
          sha256sum smartboard-dev-output/*.apk >> smartboard-dev-output/verification.txt
          git rev-parse HEAD >> smartboard-dev-output/verification.txt
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as E
          reports=list(pathlib.Path("android-tv/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          tests=sum(int(E.parse(p).getroot().get("tests","0")) for p in reports)
          failures=sum(int(E.parse(p).getroot().get("failures","0"))+int(E.parse(p).getroot().get("errors","0")) for p in reports)
          assert tests > 0 and failures == 0, f"Unit test evidence invalid: {tests} tests, {failures} failures"
          with open("smartboard-dev-output/verification.txt","a") as f: f.write(f"\nExecuted unit tests: {tests}; failures/errors: {failures}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smartboard-dev-test
          path: |
            smartboard-dev-output/
            android-tv/app/build/reports/lint-results-debug.*
            android-tv/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
