# CI: Android TV native bridge & scheduler unit + instrumented tests
# Triggers: any push/PR that touches the android-tv module or this workflow file.
name: Android TV — Scheduler & Bridge Tests

on:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/test-android-tv.yml'
  pull_request:
    paths:
      - 'android-tv/**'
      - '.github/workflows/test-android-tv.yml'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JVM (Robolectric) unit tests — fast, no emulator needed
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: JVM Unit Tests (Robolectric)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android-tv/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android-tv/**/*.gradle*', 'android-tv/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests with timestamped Logcat
        working-directory: android-tv
        run: |
          ./gradlew test --tests "com.digipal.signage.PlaylistSchedulerTest" \
            --info 2>&1 | tee /tmp/unit-test-logcat.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            android-tv/app/build/reports/tests/
            /tmp/unit-test-logcat.txt
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # KVM instrumented tests — bridge timeline regression suite
  # ─────────────────────────────────────────────────────────────────────────────
  instrumented-tests:
    name: KVM Bridge Timeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android-tv/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android-tv/**/*.gradle*', 'android-tv/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run instrumented tests (API 30 x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          avd-name: test_avd
          script: |
            cd android-tv
            ./gradlew connectedAndroidTest \
              --tests "com.digipal.signage.BridgeTimelineTest" \
              2>&1 | tee /tmp/instrumented-logcat.txt

      - name: Collect Logcat output
        if: always()
        run: |
          adb logcat -d -s DigipalBridge:D PlaylistScheduler:D > /tmp/bridge-logcat.txt || true

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            android-tv/app/build/reports/androidTests/
            /tmp/instrumented-logcat.txt
            /tmp/bridge-logcat.txt
          retention-days: 14
