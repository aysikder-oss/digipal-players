plugins {
      id 'com.android.application'
  }

  android {
      namespace 'com.digipal.signage'
      compileSdk 35

      signingConfigs {
          release {
              storeFile file(System.getenv("KEYSTORE_FILE") ?: "keystore.jks")
              storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
              keyAlias System.getenv("KEY_ALIAS") ?: ""
              keyPassword System.getenv("KEY_PASSWORD") ?: ""
          }
      }

      defaultConfig {
          applicationId "com.digipal.signage"
          minSdk 21
          targetSdk 35
          versionCode 20
          versionName "3.8.7"

          buildConfigField "String", "SERVER_URL", "\"https://www.digipalsignage.com\""
      }

      buildTypes {
          release {
              signingConfig signingConfigs.release
              minifyEnabled true
              proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
          }
          debug {
              minifyEnabled false
          }
      }

      compileOptions {
          sourceCompatibility JavaVersion.VERSION_1_8
          targetCompatibility JavaVersion.VERSION_1_8
      }

      buildFeatures {
          buildConfig true
      }

      lintOptions {
          abortOnError false
      }
  }

  dependencies {
      implementation 'androidx.appcompat:appcompat:1.6.1'
      implementation 'androidx.webkit:webkit:1.9.0'
      implementation 'com.google.android.material:material:1.11.0'
      // ExoPlayer (Media3) — native video overlay via PlayerView
      implementation 'androidx.media3:media3-exoplayer:1.3.1'
      implementation 'androidx.media3:media3-ui:1.3.1'
      implementation 'androidx.media3:media3-common:1.3.1'
      // Glide — native image overlay
      implementation 'com.github.bumptech.glide:glide:4.16.0'
  }
  