plugins {
    id 'com.android.application'
    id 'io.sentry.android.gradle'
}

def gitSha = 'unknown'
try {
    def proc = 'git rev-parse --short HEAD'.execute([], projectDir)
    proc.waitForOrKill(1000)
    gitSha = proc.text.trim()
} catch (Exception ignored) {}

def hasEnvSigning =
        System.getenv("KEYSTORE_FILE") &&
        System.getenv("KEYSTORE_PASSWORD") &&
        System.getenv("KEY_ALIAS") &&
        System.getenv("KEY_PASSWORD")

// CI (build-android-tv.yml) injects signing credentials via Gradle -P properties
// (android.injected.signing.*) rather than env vars — recognize that path too so
// release builds in CI are not incorrectly blocked.
def hasInjectedSigning =
        project.hasProperty("android.injected.signing.store.file") &&
        project.hasProperty("android.injected.signing.store.password") &&
        project.hasProperty("android.injected.signing.key.alias") &&
        project.hasProperty("android.injected.signing.key.password")

def hasReleaseSigning = hasEnvSigning || hasInjectedSigning

android {
    namespace 'com.digipal.signage'
    compileSdk 35

    signingConfigs {
        release {
            if (hasEnvSigning) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
            // When only hasInjectedSigning is true, leave fields unset here — the
            // Android Gradle Plugin auto-populates them from the injected
            // android.injected.signing.* properties passed via -P on the CLI.
        }
    }

    defaultConfig {
        applicationId "com.digipal.signage"
        minSdk 21
        targetSdk 35
        versionCode 71
        versionName "3.16.57"

        buildConfigField "String", "SERVER_URL", "\"https://www.digipalsignage.com\""
        buildConfigField "String", "SENTRY_DSN", "\"${System.getenv('SENTRY_DSN') ?: ''}\""
        buildConfigField "String", "GIT_SHA", "\"${gitSha}\""
        buildConfigField "String", "BUILD_FLAVOR", "\"android-tv\""

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        htmlReport true
        xmlReport true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease') && !hasReleaseSigning) {
        throw new GradleException("Release signing env vars are required: KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    // ExoPlayer (Media3) — native video overlay via PlayerView
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    implementation 'androidx.media3:media3-common:1.3.1'
    // ExoPlayer on-disk video cache
    implementation 'androidx.media3:media3-datasource:1.3.1'
    // Glide — native image overlay
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    // Room — offline playlist cache + native playlist DB
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    // WorkManager — crash recovery with back-off
    implementation 'androidx.work:work-runtime:2.9.0'
    // OkHttp — asset downloader with SHA256 + ETag + Range resume
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Sentry — crash & ANR reporting
    implementation 'io.sentry:sentry-android:7.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.room:room-testing:2.6.1'
}

sentry {
    // Only upload ProGuard mapping when SENTRY_AUTH_TOKEN is available AND we're
    // running in CI — a local dev machine that happens to have the token exported
    // should not also attempt this upload (its paths/sourcemaps aren't CI-shaped, so
    // it can fail spuriously outside a real CI run).
    def sentryToken = System.getenv("SENTRY_AUTH_TOKEN") ?: ""
    def isCi = System.getenv("CI") == "true" || System.getenv("GITHUB_ACTIONS") == "true"
    autoUploadProguardMapping = isCi && !sentryToken.isEmpty()
    includeNativeSources = false
    org = "digipal-signage"
    projectName = "android"
    authToken = sentryToken
    telemetry = false
    // We only use manual Sentry.captureException()/breadcrumbs — disable ASM bytecode
    // auto-instrumentation (OkHttp/Compose/FileIO tracing) to avoid corrupting unrelated
    // classes it can't fully resolve (seen as "ASM Instrumentation... wasn't able to
    // resolve some classes" in build output).
    tracingInstrumentation {
        enabled = false
    }
}
